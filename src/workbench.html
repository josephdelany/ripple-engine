<!DOCTYPE html>
<!--
  workbench.html -- THE DESK (see FRONTEND_SPEC.md). A single, self-contained, local analyst
  terminal. No framework, vanilla JS, charts drawn as inline SVG (no libraries -> fully local,
  $0, keyless). It DISPLAYS what the engine produces; it never computes analysis in the browser
  and never fabricates: article "summaries" are VERBATIM extracts of the real source, with a
  link to the page; the analysis is the deterministic engine read.

  Three columns: SOURCES (Today / Search real articles) · THE BRIEF (the story + the read) ·
  NOTES & DRAFT (write + export). Charts are significant only: the ripple (CAR curve), the
  is-this-bigger-than-normal lift view, and the cross-asset reaction.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Engine — The Desk</title>
<style>
  :root{
    --bg0:#0B0E14; --bg1:#141924; --bg2:#1C222E; --bg3:#232b39;
    --line:rgba(255,255,255,0.06); --line2:rgba(255,255,255,0.11);
    --ink:#D6DBE3; --ink2:#aeb6c2; --dim:#8A93A2; --faint:#7d8593; --ink-hi:#ffffff; --ink-max:#eef1f6;
    --pos:#2FB49B; --neg:#E5604D; --accent:#F5A623; --info:#5B8FD1; --warn:#D9A441;
    --pos-line:#26463b; --neg-line:#552c24; --warn-line:#54471f;
    --primary-bg:#183454; --primary-line:#2f6598; --primary-ink:#dbe9fb;
    --t-mega:30px; --t-h:19px; --t-body:13px; --t-sm:12px; --t-cap:11px; --t-micro:10px;
    --sp1:8px; --sp2:16px; --sp3:24px;
    --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg0); color:var(--ink); font:var(--t-body)/1.55 var(--sans);
    font-variant-numeric:tabular-nums slashed-zero; }
  a{ color:var(--info); text-decoration:none; } a:hover{ text-decoration:underline; }
  .num{ font-family:var(--mono); font-variant-numeric:tabular-nums slashed-zero; }
  .pos{ color:var(--pos); } .neg{ color:var(--neg); } .dim{ color:var(--dim); } .faint{ color:var(--faint); } .accent{ color:var(--accent); }
  h1,h2,h3,h4{ margin:0; font-weight:600; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, .item:focus-visible, .r:focus-visible{ outline:2px solid var(--info); outline-offset:1px; }

  .mast{ display:flex; align-items:center; gap:14px; height:56px; padding:0 22px; background:var(--bg1); border-bottom:1px solid var(--line2); }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .mark{ font:700 13px/1 var(--mono); letter-spacing:1px; color:var(--bg0); background:var(--accent); padding:5px 6px; border-radius:2px; }
  .brand .word{ font:600 13px/1 var(--sans); letter-spacing:1.4px; color:var(--ink); }
  .brand .deck{ font:var(--t-cap)/1 var(--mono); letter-spacing:.4px; color:var(--dim); padding-left:12px; border-left:1px solid var(--line2); }
  .dateline{ font:var(--t-cap)/1.3 var(--mono); color:var(--dim); }
  .chips{ margin-left:auto; display:flex; gap:8px; align-items:center; }
  .chip{ font:var(--t-cap)/1 var(--mono); letter-spacing:.3px; padding:4px 9px; border-radius:2px; border:1px solid var(--line2); color:var(--ink2); white-space:nowrap; }
  .chip b{ color:var(--ink); font-weight:600; }
  .chip.on{ border-color:var(--warn-line); color:var(--warn); } .chip.off{ border-color:var(--pos-line); color:var(--pos); } .chip.hot{ border-color:var(--neg-line); color:var(--neg); }

  .cmd{ display:flex; gap:10px; align-items:center; padding:11px 22px; border-bottom:1px solid var(--line); background:var(--bg0); }
  .cmd input{ flex:1; background:var(--bg1); color:var(--ink); border:1px solid var(--line2); border-radius:3px; padding:9px 12px; font:var(--t-body) var(--sans); transition:border-color .12s ease; }
  .cmd input:focus{ outline:none; border-color:var(--info); }
  button{ background:var(--bg2); color:var(--ink); border:1px solid var(--line2); border-radius:3px; padding:8px 14px; font:var(--t-sm) var(--sans); cursor:pointer; white-space:nowrap; transition:border-color .12s ease, color .12s ease, background .12s ease; }
  button:hover{ border-color:var(--info); color:var(--ink-hi); } button:active{ transform:translateY(0.5px); }
  button.primary{ background:var(--primary-bg); border-color:var(--primary-line); color:var(--primary-ink); }
  button.ghost{ background:transparent; }
  button.sel{ border-color:var(--info); color:var(--ink-hi); background:var(--bg3); }

  /* 3-column grid */
  .wrap{ display:grid; grid-template-columns:300px minmax(0,1fr) 330px; min-height:calc(100vh - 100px); }
  /* Narrow: never hide a column (that would delete scan/publish) -- reflow so all stay reachable. */
  @media (max-width:1200px){ .wrap{ grid-template-columns:270px minmax(0,1fr); }
    aside.notes{ grid-column:1 / -1; border-left:0; border-top:1px solid var(--line2); } }
  @media (max-width:860px){ .wrap{ grid-template-columns:1fr; }
    main{ order:-1; } aside.sources{ border-right:0; border-top:1px solid var(--line2); }
    .list{ max-height:320px; } }
  aside.sources{ border-right:1px solid var(--line); background:var(--bg0); padding:16px 14px; overflow:hidden; }
  main{ padding:22px 26px 90px; min-width:0; }
  .brief{ max-width:860px; }
  aside.notes{ border-left:1px solid var(--line); background:var(--bg0); padding:22px 16px 90px; }
  .prose{ max-width:68ch; }

  /* Sources */
  .tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .tabs button{ flex:1; padding:6px 8px; font-size:var(--t-cap); }
  .tabs button.sel{ background:var(--bg3); border-color:var(--info); color:var(--ink-hi); }
  .srch input{ width:100%; background:var(--bg1); color:var(--ink); border:1px solid var(--line2); border-radius:3px; padding:8px 10px; font:var(--t-sm) var(--sans); margin-bottom:10px; }
  .srch input:focus{ outline:none; border-color:var(--info); }
  .list{ overflow-y:auto; max-height:calc(100vh - 210px); }
  .item{ padding:9px 8px; margin:0 -8px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s ease; }
  .item:hover{ background:var(--bg1); } .item.active{ background:var(--bg2); }
  .item .hl{ font-size:var(--t-sm); color:var(--ink); line-height:1.4; }
  .item .sub{ font:var(--t-micro) var(--mono); color:var(--faint); margin-top:4px; display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
  .tag{ font:var(--t-micro) var(--mono); padding:1px 5px; border:1px solid var(--line2); border-radius:2px; color:var(--dim); }
  .fl-supported{ color:var(--pos); border-color:var(--pos-line); } .fl-not{ color:var(--warn); border-color:var(--warn-line); } .fl-thin{ color:var(--faint); }

  /* Brief */
  .kicker{ font:var(--t-micro)/1.4 var(--mono); letter-spacing:2px; text-transform:uppercase; color:var(--faint); }
  .story{ border:1px solid var(--line2); border-left:2px solid var(--info); border-radius:2px; padding:14px 16px; margin:8px 0 4px; background:var(--bg1); }
  .story .h{ font:600 15px/1.4 var(--sans); color:var(--ink-max); max-width:68ch; }
  .story .meta{ font:var(--t-cap) var(--mono); color:var(--faint); margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .story .excerpt{ margin-top:10px; font-size:var(--t-sm); line-height:1.6; color:var(--ink2); max-width:70ch; border-top:1px solid var(--line); padding-top:10px; }
  .story .excerpt .lbl{ font:var(--t-micro) var(--mono); letter-spacing:1px; text-transform:uppercase; color:var(--faint); display:block; margin-bottom:4px; }
  .bluf{ font:500 var(--t-h)/1.42 var(--sans); margin:16px 0 4px; color:var(--ink-max); max-width:68ch; }
  .bluf b{ color:var(--ink-hi); font-weight:700; } .bluf .neg{ color:var(--neg); } .bluf .pos{ color:var(--pos); }
  .badges{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 2px; }
  .badge{ font:var(--t-cap)/1 var(--mono); padding:4px 9px; border-radius:2px; border:1px solid var(--line2); color:var(--ink2); }
  .badge.faint{ color:var(--faint); }
  .decision{ margin-top:16px; padding:12px 14px; background:var(--bg1); border:1px solid var(--line2); border-left:2px solid var(--accent); border-radius:2px; font-size:var(--t-body); color:var(--ink); max-width:68ch; }
  .decision b{ color:var(--accent); font:var(--t-micro) var(--mono); letter-spacing:1.5px; text-transform:uppercase; }

  section.blk{ border-top:1px solid var(--line); margin-top:var(--sp3); padding-top:var(--sp2); }
  section.blk > h3{ font:var(--t-micro)/1.4 var(--mono); letter-spacing:2px; text-transform:uppercase; color:var(--faint); margin-bottom:var(--sp2); }
  section.blk > h3 .ctx{ color:var(--faint); text-transform:none; letter-spacing:.3px; }
  .lead-metric{ display:flex; gap:26px; align-items:flex-end; flex-wrap:wrap; }
  .lead-metric .big{ font:var(--t-mega)/1 var(--mono); color:var(--ink-hi); font-variant-numeric:tabular-nums slashed-zero; }
  .lead-metric .lbl{ font-size:var(--t-cap); color:var(--dim); max-width:44ch; line-height:1.5; }
  .ci{ font:var(--t-cap) var(--mono); color:var(--dim); }
  .charts{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; margin-top:var(--sp2); }
  @media (max-width:760px){ .charts{ grid-template-columns:1fr; } }
  .chart{ min-width:0; } .chart .cap{ font:var(--t-micro) var(--mono); color:var(--ink2); margin-bottom:4px; letter-spacing:.5px; }
  .chart .q{ color:var(--accent); } .chart .sub{ font:var(--t-micro) var(--mono); color:var(--faint); margin-top:4px; line-height:1.4; }

  table.grid{ width:100%; border-collapse:collapse; font-size:var(--t-sm); }
  table.grid th, table.grid td{ text-align:left; padding:6px 12px 6px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  table.grid td:last-child, table.grid th:last-child{ padding-right:4px; }
  table.grid th{ font:var(--t-micro) var(--mono); letter-spacing:.5px; text-transform:uppercase; color:var(--faint); font-weight:500; }
  table.grid td.n, table.grid th.n{ text-align:right; font-family:var(--mono); }
  tr.click{ cursor:pointer; } tr.click:hover td{ background:var(--bg1); }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:var(--t-sm); }
  .kv .k{ color:var(--faint); font:var(--t-micro) var(--mono); letter-spacing:.3px; text-transform:uppercase; padding-top:2px; }
  .verdict{ padding:10px 12px; background:var(--bg1); border:1px solid var(--line); border-left:2px solid var(--info); border-radius:2px; font-size:var(--t-sm); max-width:68ch; }
  .verdict.warn{ border-left-color:var(--warn); } .verdict.neg{ border-left-color:var(--neg); }
  .synthesis{ font-size:var(--t-body); line-height:1.64; color:var(--ink2); max-width:68ch; }
  .synthesis b{ color:var(--ink); }
  ul.watch{ margin:0; padding-left:0; list-style:none; max-width:68ch; }
  ul.watch li{ padding:8px 0 8px 18px; border-bottom:1px solid var(--line); position:relative; font-size:var(--t-sm); color:var(--ink2); }
  ul.watch li:before{ content:"›"; position:absolute; left:2px; color:var(--accent); font-family:var(--mono); }
  .disc{ font-size:var(--t-cap); color:var(--faint); line-height:1.5; }
  details.receipts{ margin-top:var(--sp2); } details.receipts summary{ font:var(--t-micro) var(--mono); letter-spacing:1px; text-transform:uppercase; color:var(--faint); cursor:pointer; }
  details.receipts li{ font:var(--t-cap) var(--mono); color:var(--dim); }
  .footer-note{ border-top:1px solid var(--line2); margin-top:var(--sp2); padding-top:10px; font:var(--t-cap) var(--mono); color:var(--faint); line-height:1.5; }
  .glossary{ margin-top:var(--sp1); } .glossary summary{ font:var(--t-micro) var(--mono); letter-spacing:1px; text-transform:uppercase; color:var(--faint); cursor:pointer; }
  .glossary dl{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:8px 0 0; font-size:var(--t-cap); }
  .glossary dt{ color:var(--ink2); font-family:var(--mono); } .glossary dd{ margin:0; color:var(--dim); }

  /* Notes */
  aside.notes h4{ font:var(--t-micro) var(--mono); letter-spacing:2px; text-transform:uppercase; color:var(--faint); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  aside.notes .meta{ font:var(--t-micro) var(--mono); color:var(--faint); font-weight:400; }
  textarea{ width:100%; background:var(--bg1); color:var(--ink); border:1px solid var(--line2); border-radius:3px; padding:10px; font:var(--t-sm) var(--mono); resize:vertical; transition:border-color .12s ease; }
  textarea:focus{ outline:none; border-color:var(--info); } #notes{ min-height:260px; }
  .savestate{ font:var(--t-micro) var(--mono); color:var(--faint); }
  .rail-actions{ display:flex; gap:7px; margin-top:8px; flex-wrap:wrap; } .rail-actions button{ padding:6px 10px; font-size:var(--t-cap); }
  .corpus{ border-top:1px solid var(--line2); margin-top:24px; padding-top:14px; }
  .corpus input{ width:100%; background:var(--bg1); color:var(--ink); border:1px solid var(--line2); border-radius:3px; padding:8px 10px; font:var(--t-sm) var(--sans); }
  .corpus input:focus{ outline:none; border-color:var(--info); }
  .results{ max-height:240px; overflow:auto; margin-top:10px; }
  .results .r{ display:flex; gap:10px; align-items:baseline; padding:6px 8px; margin:0 -8px; border-bottom:1px solid var(--line); cursor:pointer; font-size:var(--t-sm); transition:background .12s ease; }
  .results .r:hover{ background:var(--bg1); } .results .rd{ font:var(--t-micro) var(--mono); color:var(--faint); white-space:nowrap; }
  #eventDetail{ display:none; margin-top:12px; padding:12px; background:var(--bg1); border:1px solid var(--line); border-radius:3px; }

  .spin{ color:var(--faint); font:var(--t-cap) var(--mono); padding:14px 0; }
  .skel{ height:14px; background:var(--bg1); border-radius:2px; margin:10px 0; animation:pulse 1.3s ease-in-out infinite; }
  .skel.w-lead{ height:22px; width:82%; } .skel.w-2{ width:64%; } .skel.w-3{ width:72%; }
  @keyframes pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:.9; } }
  @media (prefers-reduced-motion:reduce){ .skel{ animation:none; } }
  .errbox{ border:1px solid var(--neg-line); border-left:2px solid var(--neg); border-radius:2px; padding:14px 16px; background:var(--bg1); max-width:68ch; }
  .errbox .k{ font:var(--t-micro) var(--mono); letter-spacing:1.5px; text-transform:uppercase; color:var(--neg); }
  .empty{ color:var(--faint); padding:20px 0; text-align:center; font-size:var(--t-sm); }
  svg{ display:block; max-width:100%; height:auto; }
  #brentSpark{ display:inline-block; width:120px; height:28px; vertical-align:middle; }

  /* The Read — a calm, spacious, editorial presentation of the deconstruction. */
  .rd{ max-width:680px; margin:0 auto; padding:6px 0 70px; }
  .rd-kicker{ font:var(--t-micro)/1.4 var(--mono); letter-spacing:2.4px; text-transform:uppercase; color:var(--faint); }
  .rd-type{ display:inline-block; margin-left:8px; padding:2px 8px; border:1px solid var(--line2); border-radius:20px; color:var(--ink2); letter-spacing:.5px; }
  .rd-head{ font:400 27px/1.46 ui-serif,"New York",Georgia,serif; color:var(--ink-max); letter-spacing:-0.2px; margin:16px 0 6px; }
  .rd-head b{ font-weight:700; color:var(--ink-hi); }
  .rd-head .neg{ color:var(--neg); } .rd-head .pos{ color:var(--pos); }
  .rd-src{ font:var(--t-cap) var(--mono); color:var(--faint); margin-bottom:8px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .rd-lead{ font-size:14px; line-height:1.6; color:var(--dim); max-width:64ch; margin-bottom:8px; }
  .rd-section{ font:var(--t-micro)/1.4 var(--mono); letter-spacing:2px; text-transform:uppercase; color:var(--faint); margin:38px 0 4px; }
  .rd-claim{ padding:24px 0; border-bottom:1px solid var(--line); }
  .rd-quote{ font:400 17px/1.62 ui-serif,"New York",Georgia,serif; color:var(--ink-max); margin:0; }
  .rd-quote:before{ content:"“"; color:var(--faint); } .rd-quote:after{ content:"”"; color:var(--faint); }
  .rd-verdict{ display:flex; gap:11px; margin-top:14px; font-size:13.5px; line-height:1.62; color:var(--ink); align-items:flex-start; }
  .rd-verdict b{ color:var(--ink-hi); }
  .rd-verdict .dot{ flex:0 0 auto; width:9px; height:9px; border-radius:50%; margin-top:6px; background:var(--dim); }
  .rd-verdict.material .dot{ background:var(--accent); }
  .rd-verdict.in_line .dot{ background:var(--dim); }
  .rd-verdict.insufficient .dot, .rd-verdict.no_class .dot{ background:var(--faint); }
  .rd-legend{ font:var(--t-cap) var(--mono); color:var(--faint); margin:2px 0 4px; display:flex; gap:16px; flex-wrap:wrap; }
  .rd-legend .lg{ display:inline-flex; gap:6px; align-items:center; }
  .rd-legend .d{ width:8px; height:8px; border-radius:50%; }
  .rd-legend .d.m{ background:var(--accent); } .rd-legend .d.i{ background:var(--dim); } .rd-legend .d.n{ background:var(--faint); }
  .rd-tags{ margin-top:10px; display:flex; gap:7px; flex-wrap:wrap; }
  .rd-ev{ margin-top:12px; }
  .rd-ev summary{ font:var(--t-cap) var(--mono); color:var(--info); cursor:pointer; letter-spacing:.3px; }
  .rd-ev .body{ margin-top:10px; padding:12px 14px; background:var(--bg1); border:1px solid var(--line); border-radius:6px; font-size:12.5px; }
  .rd-mood{ margin-top:40px; padding:18px 20px; background:var(--bg1); border-radius:8px; }
  .rd-mood h4{ font:var(--t-micro) var(--mono); letter-spacing:2px; text-transform:uppercase; color:var(--faint); margin-bottom:12px; }
  .rd-mood .row{ display:flex; gap:12px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .rd-mood .row:last-child{ border-bottom:0; }
  .rd-mood .k{ flex:0 0 130px; color:var(--faint); font:var(--t-cap) var(--mono); }
  .rd-cta{ display:flex; gap:10px; margin:32px 0 0; flex-wrap:wrap; }
  .rd-foot{ margin-top:26px; font:var(--t-cap) var(--mono); color:var(--faint); line-height:1.6; }

  @media print{
    :root{ color-scheme:light; --bg0:#fff; --bg1:#fff; --bg2:#f6f6f6; --bg3:#eee;
      --line:#dcdcdc; --line2:#bcbcbc; --ink:#111; --ink2:#222; --dim:#444; --faint:#666; --ink-hi:#000; --ink-max:#000;
      --pos:#0A7D34; --neg:#B3261E; --info:#1a4a7a; --accent:#7a5200; --warn:#7a5200; }
    body{ background:#fff; color:#111; font-size:11pt; }
    .cmd, aside, .no-print, details.receipts summary, .glossary summary{ display:none !important; }
    .wrap{ display:block; } main{ padding:0; } .brief{ max-width:100%; }
    details.receipts > ul, .glossary dl{ display:block !important; }
    section.blk, .chart, table.grid, .verdict, .lead-metric, .decision, .story, ul.watch li{ break-inside:avoid; }
    h3,h4{ break-after:avoid; } p,li{ orphans:3; widows:3; } a{ color:#000; text-decoration:none; }
    @page{ size:A4; margin:16mm 15mm 18mm; @bottom-right{ content:"Page " counter(page) " of " counter(pages); } }
  }
</style>
</head>
<body>
<header class="mast">
  <div class="brand"><span class="mark">RE</span><span class="word">RIPPLE ENGINE</span><span class="deck">The Desk</span></div>
  <div class="dateline" id="dateline">loading…</div>
  <div class="chips" id="chips"></div>
</header>

<div class="cmd no-print">
  <input id="q" type="text" placeholder="Paste any headline, paragraph, or article URL — then press Enter to read it…">
  <button class="primary" onclick="readArticle($('q').value)">Read it</button>
  <button onclick="loadDaily()">Daily Brief</button>
  <button id="navDb" onclick="showView('db')">Database</button>
  <button class="ghost" onclick="window.print()">Print / PDF</button>
</div>

<div class="wrap">
  <!-- SOURCES -->
  <aside class="sources no-print">
    <div class="tabs">
      <button id="tabToday" class="sel" onclick="showTab('today')">Today</button>
      <button id="tabSearch" onclick="showTab('search')">Web search</button>
    </div>
    <div id="paneSearch" style="display:none" class="srch">
      <input id="asq" type="text" placeholder="search the global press (GDELT) — any topic, e.g. Larak Island strike">
      <div id="coverage" class="disc" style="margin-bottom:8px"></div>
    </div>
    <div class="meta" id="srcMeta" style="font:var(--t-micro) var(--mono);color:var(--faint);margin-bottom:8px"></div>
    <div class="list" id="srcList"><div class="spin">loading…</div></div>
  </aside>

  <!-- THE BRIEF / DATABASE -->
  <main><div class="brief" id="brief"></div><div id="dbview" style="display:none"></div></main>

  <!-- NOTES & DRAFT -->
  <aside class="notes no-print">
    <h4>Notes &amp; Draft <span style="flex:1"></span><span class="savestate" id="saveState"></span></h4>
    <textarea id="notes" placeholder="Your analysis, beside the numbers. ‘Insert brief’ drops the current brief's key figures in as a sourced, quotable block; ‘export draft’ writes a Substack-ready markdown file."></textarea>
    <div class="rail-actions">
      <button onclick="insertBrief()">↳ insert brief</button>
      <button class="primary" onclick="exportDraft()">export draft →</button>
    </div>
    <div class="disc" id="exportPath" style="margin-top:6px"></div>

    <div class="corpus">
      <h4>Corpus <span class="meta">the coded event shelf</span></h4>
      <input id="hq" type="text" placeholder="search history — hormuz, opec_decision, 2019…">
      <div class="results" id="hres"></div>
      <div id="eventDetail"></div>
    </div>
  </aside>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sgn=v=>v==null?"":(v>=0?"+":"");
const mnum=(v,d=1)=>v==null?"":(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d);
const f1=v=>v==null?"n/a":Number(v).toFixed(1);
const f2=v=>v==null?"n/a":Number(v).toFixed(2);
const cls=v=>v==null?"":v>=0?"pos":"neg";
const arrow=v=>v==null?"":v>=0?"▲":"▼";
function ord(n){ if(n==null) return ""; n=Math.round(n); const s=["th","st","nd","rd"],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
const isURL=s=>/^https?:\/\//i.test((s||"").trim());
async function getJSON(u){ const r=await fetch(u); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function postJSON(u,b){ const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }

let CURRENT=null; const cited=new Set();

/* ---------------- inline SVG charts (no library) ---------------- */
function niceTicks(min,max,n){ const span=(max-min)||1, step0=span/(n||4), mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag, step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag, out=[];
  for(let v=Math.ceil(min/step)*step; v<=max+1e-9; v+=step) out.push(+v.toFixed(4)); return out; }

function sparkline(vals,{w=120,h=28,color="var(--info)"}={}){
  const v=(vals||[]).filter(x=>x!=null); if(v.length<2) return "";
  const mn=Math.min(...v),mx=Math.max(...v),pad=3,W=w-2*pad,H=h-2*pad,rng=(mx-mn)||1;
  const X=i=>pad+i/(v.length-1)*W, Y=x=>pad+H-(x-mn)/rng*H;
  const d=v.map((x,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.25" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(v.length-1).toFixed(1)}" cy="${Y(v[v.length-1]).toFixed(1)}" r="1.5" fill="${color}"/></svg>`;
}

function carCurve(curve,{w=440,h=200}={}){
  if(!curve||curve.length<2) return `<div class="sub">insufficient path data (n&lt;2)</div>`;
  const pl=42,pr=48,pt=14,pb=24, W=w-pl-pr, H=h-pt-pb;
  const ts=curve.map(p=>p.t), up=curve.map(p=>p.mean+p.se), dn=curve.map(p=>p.mean-p.se);
  const tmin=Math.min(...ts),tmax=Math.max(...ts);
  let ymin=Math.min(0,...dn), ymax=Math.max(0,...up); const ypad=((ymax-ymin)||1)*0.06; ymin-=ypad; ymax+=ypad;
  const X=t=>pl+(t-tmin)/((tmax-tmin)||1)*W, Y=y=>pt+H-(y-ymin)/((ymax-ymin)||1)*H;
  const ticks=niceTicks(ymin,ymax,5).filter(v=>v>=ymin&&v<=ymax);
  const grid=ticks.map(v=>`<line x1="${pl}" y1="${Y(v).toFixed(1)}" x2="${w-pr}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
     <text x="${pl-6}" y="${Y(v).toFixed(1)}" fill="var(--faint)" font-size="9" text-anchor="end" dominant-baseline="central" font-family="var(--mono)">${mnum(v,1)}</text>`).join("");
  const meanD=curve.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.mean).toFixed(1)}`).join(" ");
  const bandTop=curve.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.mean+p.se).toFixed(1)}`).join(" ");
  const bandD=bandTop+" "+curve.slice().reverse().map((p,i)=>`L${X(p.t).toFixed(1)},${Y(p.mean-p.se).toFixed(1)}`).join(" ")+"Z";
  const last=curve[curve.length-1], y0=Y(0), x0=X(0), hasZero=(tmin<=0&&tmax>=0);
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    ${grid}
    <line x1="${pl}" y1="${y0.toFixed(1)}" x2="${w-pr}" y2="${y0.toFixed(1)}" stroke="var(--dim)" stroke-width="1"/>
    ${hasZero?`<line x1="${x0.toFixed(1)}" y1="${pt}" x2="${x0.toFixed(1)}" y2="${pt+H}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="${x0.toFixed(1)}" y="${pt+H+14}" fill="var(--faint)" font-size="9" text-anchor="middle" font-family="var(--mono)">event day</text>`:""}
    <text x="${pl}" y="${pt+H+14}" fill="var(--faint)" font-size="9" font-family="var(--mono)">${tmin}d</text>
    <text x="${w-pr}" y="${pt+H+14}" fill="var(--faint)" font-size="9" text-anchor="end" font-family="var(--mono)">+${tmax}d</text>
    <path d="${bandD}" fill="var(--info)" opacity="0.13"/>
    <path d="${bandTop}" fill="none" stroke="var(--info)" stroke-width="0.5" opacity="0.35"/>
    <path d="${meanD}" fill="none" stroke="var(--info)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(last.t).toFixed(1)}" cy="${Y(last.mean).toFixed(1)}" r="2.5" fill="var(--info)"/>
    <text x="${(X(last.t)+6).toFixed(1)}" y="${Y(last.mean).toFixed(1)}" fill="var(--ink)" font-size="10" dominant-baseline="central" font-family="var(--mono)">${mnum(last.mean,1)}%</text>
  </svg>`;
}

// The lift view: this class's typical move marked on the distribution of ORDINARY 20-day moves.
// Outliers past the axis are marked "+N beyond", never silently clamped onto the wall (that would
// hide the very evidence the chart exists to show). Median labels clamp to the viewport edges.
function magBaseline(dist,{w=440,h=176}={}){
  if(!dist||!dist.bins||!dist.bins.length) return `<div class="sub">no distribution</div>`;
  const pl=10,pr=10,pt=18,pb=34, W=w-pl-pr, H=h-pt-pb;
  const fin=v=>typeof v==="number"&&isFinite(v);
  const xmax=dist.axis_max||Math.max(...dist.bins.map(b=>b.x1),1);
  const nmax=Math.max(...dist.bins.map(b=>b.n),1);
  const X=v=>pl+Math.min(Math.max(v,0),xmax)/xmax*W, Y=n=>pt+H-n/nmax*H;
  // label with anchor clamped to the walls so long labels never overflow
  const lab=(x,txt,col,y,big)=>{ const a=x>w-74?"end":x<74?"start":"middle", lx=x>w-74?(w-pr):x<74?pl:x;
    return `<text x="${lx.toFixed(1)}" y="${y}" fill="${col}" font-size="${big?10:9}" text-anchor="${a}" font-family="var(--mono)">${esc(txt)}</text>`; };
  let bars=""; dist.bins.forEach(b=>{ const x0=X(b.x0),x1=X(b.x1); bars+=`<rect x="${x0.toFixed(1)}" y="${Y(b.n).toFixed(1)}" width="${Math.max(x1-x0-1,0.6).toFixed(1)}" height="${(pt+H-Y(b.n)).toFixed(1)}" fill="var(--dim)" opacity="0.30"/>`; });
  const iqr=dist.class_iqr||[]; const band=(iqr.length===2&&fin(iqr[0])&&fin(iqr[1]))?`<rect x="${X(Math.min(iqr[0],iqr[1])).toFixed(1)}" y="${pt}" width="${Math.max(Math.abs(X(iqr[1])-X(iqr[0])),1).toFixed(1)}" height="${H}" fill="var(--accent)" opacity="0.10"/>`:"";
  let mid="", om=dist.ordinary_median, cm=dist.class_median;
  if(fin(om)) mid+=`<line x1="${X(om).toFixed(1)}" y1="${pt}" x2="${X(om).toFixed(1)}" y2="${pt+H}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>`+lab(X(om),`ordinary ${f1(om)}%`,"var(--faint)",h-16);
  if(fin(cm)) mid+=`<line x1="${X(cm).toFixed(1)}" y1="${pt-3}" x2="${X(cm).toFixed(1)}" y2="${pt+H}" stroke="var(--accent)" stroke-width="1.75"/>`+lab(X(cm),`this class ${f1(cm)}%`,"var(--accent)",pt-5,true);
  const vals=dist.class_values||[], inr=vals.filter(v=>v<=xmax), over=vals.length-inr.length;
  let rug=""; inr.forEach(v=>{ rug+=`<line x1="${X(v).toFixed(1)}" y1="${pt+H+2}" x2="${X(v).toFixed(1)}" y2="${pt+H+7}" stroke="var(--accent)" stroke-width="1" opacity="0.5"/>`; });
  const axisR=over>0?`↑ ${over} beyond axis`:`${Math.round(xmax)}%+ |20-day move|`;
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    ${band}${bars}${mid}${rug}
    <text x="${pl}" y="${h-4}" fill="var(--faint)" font-size="9" font-family="var(--mono)">0%</text>
    <text x="${w-pr}" y="${h-4}" fill="var(--accent)" font-size="9" text-anchor="end" font-family="var(--mono)">${axisR}</text>
  </svg>`;
}

function divergingBars(items,{w=440,rowH=24}={}){
  items=(items||[]).filter(it=>it&&it.car20!=null);
  if(!items.length) return `<div class="sub">no cross-asset data</div>`;
  const groups={}; items.forEach(it=>{ (groups[it.unit]=groups[it.unit]||[]).push(it); });
  const labW=140, valW=74, barW=w-labW-valW, cx=labW+barW/2, trunc=s=>s.length>19?s.slice(0,18)+"…":s;
  let html="";
  for(const unit of Object.keys(groups)){
    const g=groups[unit], mx=Math.max(...g.map(it=>Math.abs(it.car20)),0.0001), h=g.length*rowH+18;
    html+=`<div class="sub">reaction in ${unit==="%"?"price assets — CAR %, +20 days":"yields — bps, +20 days"} (scaled to ${mx.toFixed(1)}${unit==="%"?"%":" bps"} max)</div>`;
    html+=`<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMid meet">`;
    html+=`<line x1="${cx}" y1="4" x2="${cx}" y2="${g.length*rowH+4}" stroke="var(--line2)" stroke-width="1"/>`;
    html+=`<text x="${cx}" y="${g.length*rowH+15}" fill="var(--faint)" font-size="9" text-anchor="middle" font-family="var(--mono)">0</text>`;
    g.forEach((it,i)=>{ const y=6+i*rowH, len=Math.abs(it.car20)/mx*(barW/2-10), pos=it.car20>=0, x=pos?cx:cx-len, col=pos?"var(--pos)":"var(--neg)";
      html+=`<text x="0" y="${y+(rowH-8)/2}" dominant-baseline="central" fill="var(--ink2)" font-size="11" font-family="var(--sans)">${esc(trunc(it.label))}</text>`;
      html+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(len,0.5).toFixed(1)}" height="${rowH-8}" fill="${col}"/>`;
      html+=`<text x="${w}" y="${y+(rowH-8)/2}" dominant-baseline="central" fill="${col}" font-size="11" text-anchor="end" font-family="var(--mono)">${mnum(it.car20,1)}${unit==="%"?"%":""}</text>`;
    });
    html+=`</svg>`;
  }
  return html;
}

/* ---------------- masthead ---------------- */
function setChips(b){
  const mn=b.market_now||{}, pv=b.priced_vs_view||{}, amp=b.amplifier||{};
  const gpr=mn.gpr||{}, gap=(pv.gap||{}), bp=mn.brent||{};
  const gd=(b.generated_at||"").slice(0,10); let stale="";
  if(b.as_of && gd && b.as_of < gd){ const dd=Math.round((new Date(gd)-new Date(b.as_of))/86400000);
    stale=` · <span style="color:var(--warn)">⚠ panel ${dd}d stale</span>`; }
  $("dateline").innerHTML="DATA AS OF "+esc(b.as_of||"—")+(bp.level!=null?"   ·   BRENT "+esc(bp.level)+" ("+mnum(bp.chg5d,1)+"% 5d)":"")+stale;
  const chips=[]; const ampc=amp.state==="ON"?"on":amp.state==="OFF"?"off":"";
  chips.push(`<span class="chip ${ampc}">STRESS <b>${amp.state==="ON"?"ELEVATED":amp.state==="OFF"?"CALM":"?"}</b></span>`);
  if(gpr.percentile!=null) chips.push(`<span class="chip ${gpr.percentile>=80?"hot":""}">GEO-RISK <b>${ord(gpr.percentile)}</b> pct</span>`);
  if(gap.direction){ const gc=gap.direction==="over_priced_fear"?"on":gap.direction==="under_priced_risk"?"hot":"";
    chips.push(`<span class="chip ${gc}">MKT GAP <b>${esc(gap.direction.replace(/_/g," "))}</b></span>`); }
  $("chips").innerHTML=chips.join("");
}

/* ---------------- open / analyze ---------------- */
function skeleton(){ return `<div class="skel w-lead"></div><div class="skel w-3"></div><div class="skel w-2"></div><div style="height:24px"></div><div class="skel w-3"></div><div class="skel"></div><div class="skel w-2"></div>`; }
function errorBox(msg){ return `<div class="errbox"><div class="k">Unavailable</div><div style="margin-top:6px">${esc(msg)}</div><div class="rail-actions"><button onclick="loadDaily()">Daily brief</button></div></div>`; }

async function loadDaily(){ showDesk(); $("brief").innerHTML=skeleton();
  try{ const b=await getJSON("/wb_daily_brief"); let src=null;
    if(b.story && b.story.url){ src=await extractFor(b.story.url, b.story.source); }
    renderBrief(b, src); }
  catch(e){ $("brief").innerHTML=errorBox("Couldn't load the daily brief. Is the backend running? (python3 src/backend.py)"); } }

async function analyze(){ const t=$("q").value.trim(); if(!t) return; showDesk(); $("brief").innerHTML=skeleton();
  try{ const b=await postJSON("/wb_brief",{text:t}); let src=null;
    if(isURL(t)) src=await extractFor(t, "");
    renderBrief(b, src); }
  catch(e){ $("brief").innerHTML=errorBox("The read request failed."); } }

async function openArticle(headline,url,source){
  // Opening an article = READING it (the deconstruction). Deconstruct the URL when we have one
  // (fetches the full body -> all claims); else the headline.
  readArticle(url || headline, {source: source || "", url: url || ""});
}
async function extractFor(url,source){ try{ const e=await getJSON("/wb_extract?url="+encodeURIComponent(url));
  return {source:source||"", url, excerpt:e.ok?e.excerpt:null, note:e.ok?e.note:null}; }catch(_){ return {source:source||"",url,excerpt:null}; } }

function md(t){ return esc(t||"").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
  .replace(/(^|[\s(])([-−]\d+(?:\.\d+)?%)/g,'$1<span class="neg">$2</span>')
  .replace(/(^|[\s(])(\+\d+(?:\.\d+)?%)/g,'$1<span class="pos">$2</span>'); }
function glossary(){ return `<details class="glossary"><summary>How to read this</summary><dl>
  <dt>CAR</dt><dd>cumulative abnormal return — the market move beyond oil's normal drift, over N trading days.</dd>
  <dt>percentile</dt><dd>where a value sits in its own history (50th = median, 90th = higher than 90% of the past).</dd>
  <dt>OVX / GPR</dt><dd>OVX = the options market's priced oil-volatility; GPR = a news-based geopolitical-risk index.</dd>
  <dt>90% CI</dt><dd>a bootstrap confidence interval — the plausible range for the estimate given a small sample.</dd>
  <dt>bps</dt><dd>basis points; 100 bps = 1 percentage point (bond yields).</dd></dl></details>`; }

function renderBrief(b, src){
  if(!b){ $("brief").innerHTML=errorBox("Empty response."); return; }
  if(b.error){ $("brief").innerHTML=errorBox(b.note||b.error); return; }
  CURRENT=b; setChips(b); (b.precedent||[]).forEach(a=>cited.add(a.event_id));
  const s=b.story||{}, qr=b.quant_read, mn=b.market_now||{}, pv=b.priced_vs_view||{}, cf=b.confidence||{};
  const classified=!!qr; src=src||{};
  const srcName=src.source||s.source||"", srcUrl=src.url||s.url||"";

  let h="";
  h+=`<div class="kicker">${b.daily_pick?"Daily Brief · "+esc(b.daily_pick.day):"Analytical Brief"} · generated ${esc((b.generated_at||"").slice(0,16).replace("T"," "))} UTC</div>`;
  // THE STORY (source + excerpt + link)
  h+=`<div class="story"><div class="h">${esc(s.input||"")}</div>
      <div class="meta">${srcName?`<span>${esc(srcName)}</span>`:""}${s.date&&s.date!=="not specified"?`<span>${esc(s.date)}</span>`:""}
        ${srcUrl?`<a href="${esc(srcUrl)}" target="_blank" rel="noopener">read the original ↗</a>`:""}
        <span class="tag">${esc(s.event_class||"unclassified")}</span></div>`;
  if(src.excerpt) h+=`<div class="excerpt"><span class="lbl">From the source — verbatim excerpt</span>${esc(src.excerpt)}</div>`;
  else if(srcUrl) h+=`<div class="excerpt"><span class="lbl">From the source</span><span class="faint">Couldn't fetch the article body here — open “read the original ↗”. (The engine read below stands on the headline + the corpus.)</span></div>`;
  h+=`</div>`;

  h+=`<div class="bluf">${md(b.bottom_line)}</div>`;
  h+=`<div class="badges"><span class="badge${classified?"":" faint"}">${esc(s.event_class||"unclassified")}</span>
      <span class="badge faint">${(s.entities||[]).length} entities</span>
      <span class="badge">confidence: ${esc(cf.tier||"?")}</span></div>`;
  if(classified && (s.classification_evidence||[]).length)
    h+=`<div class="disc" style="margin-top:6px">classified <b>${esc(s.event_class)}</b> on the term(s): ${(s.classification_evidence).map(esc).join(", ")} — deterministic vocab match, challengeable.</div>`;
  if(b.decision_read) h+=`<div class="decision"><b>Decision read</b><br>${esc(b.decision_read.replace(/^For a decision-maker:\s*/i,""))}</div>`;

  if(classified){
    const a=qr.abs_car20, bl=qr.baseline, d=qr.direction;
    h+=`<section class="blk"><h3>The Quant Read <span class="ctx">— how Brent has behaved around this class (n=${qr.n}, sample: ${esc(qr.gate)})</span></h3>`;
    h+=`<div class="lead-metric"><div><div class="big">${sgn(a.median_pct)}${f1(a.median_pct)}%</div>
          <div class="ci">median 20-day move · typical band ${f1(a.iqr_pct[0])}–${f1(a.iqr_pct[1])}% · 90% CI [${f1(a.ci90_median_pct[0])}, ${f1(a.ci90_median_pct[1])}]</div></div>
        <div class="lbl">Direction split ${d.up_pct}% up / ${d.down_pct}% down — size, not a directional call.
          An ordinary month moves a median ${f1(bl.ordinary_median_pct)}%; this class sits at the <b>${ord(bl.class_median_percentile)}</b> percentile of everyday moves.
          ${a.max_event?`Max ${f1(a.max_event.abs_car20_pct)}% = “${esc(a.max_event.title)}” (${esc((a.max_event.date||"").slice(0,7))}), an outlier.`:""}</div></div>`;
    h+=`<div class="charts">
        <div class="chart"><div class="cap">The ripple — <span class="q">how did oil actually move?</span></div>${carCurve(qr.car_curve)}
          <div class="sub">Cumulative abnormal return in Brent, mean ±1 SE, days around the event. Constant-mean event study (MacKinlay 1997).</div></div>
        <div class="chart"><div class="cap">Is this bigger than normal? — <span class="q">does it matter, or is it churn?</span></div>${magBaseline(qr.distribution)}
          <div class="sub">This class's median move (amber) vs the distribution of ordinary 20-day moves (grey). Ticks = every comparable event.</div></div>
        <div class="chart"><div class="cap">Where else it hits — <span class="q">what else moves?</span></div>${divergingBars(qr.cross_asset)}
          <div class="sub">Same shock, measured across assets. % and bps on separate scales.</div></div>
       </div>`;
    h+=`<table class="grid" style="margin-top:16px"><tr><th>horizon</th>`+qr.car_horizons.map(x=>`<th class="n">+${x.h}d</th>`).join("")+`</tr>`;
    h+=`<tr><td class="dim">mean move</td>`+qr.car_horizons.map(x=>`<td class="n ${cls(x.mean_pct)}">${arrow(x.mean_pct)} ${f1(x.mean_pct)}%</td>`).join("")+`</tr>`;
    h+=`<tr><td class="faint">90% CI</td>`+qr.car_horizons.map(x=>`<td class="n faint" style="font-size:var(--t-micro)">[${f1(x.ci90[0])}, ${f1(x.ci90[1])}]</td>`).join("")+`</tr></table></section>`;
  }

  if((b.precedent||[]).length){
    h+=`<section class="blk"><h3>Verified Precedent <span class="ctx">— nearest real corpus events (click to inspect)</span></h3><table class="grid">
        <tr><th>date</th><th>event</th><th class="n">20-day move</th><th class="n">shared</th><th>src</th></tr>`;
    b.precedent.forEach(a=>{ h+=`<tr class="click" data-ev="${esc(a.event_id)}">
      <td class="n">${esc(a.date)}</td><td>${esc((a.title||"").slice(0,54))} <span class="faint">${esc(a.type)}</span></td>
      <td class="n">${a.abs_car20_pct!=null?f1(a.abs_car20_pct)+"%":"n/a"}</td>
      <td class="n ${a.shared_entities?"":"faint"}">${a.shared_entities}</td>
      <td>${a.source_url?`<a href="${esc(a.source_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗</a>`:""}</td></tr>`; });
    h+=`</table><div class="disc" style="margin-top:6px">“shared” = entities in common with the story. 0 = a type-only match (weaker precedent).</div></section>`;
  }

  const bp=mn.brent||{}, ov=mn.priced_oil_vol||{}, gp=mn.gpr||{};
  h+=`<section class="blk"><h3>Market State Now ${classified?"<span class='ctx'>— what a shock would land in</span>":"<span class='ctx'>— context only, not a read on this story</span>"}</h3>
      <div class="kv">

    h+=`<div class="kv" style="margin-top:10px"><span class="k">Engine–market gap</span><span><b>${esc((gap.direction||"—").replace(/_/g," "))}</b> — engine call “${esc(gap.engine_call||"?")}” vs oil vol priced at the ${ord(gap.ovx_percentile)} percentile</span>`;

    h+=`</div>`;
    if((pv.prediction_markets||[]).length){

      h+=`</table><div class="disc" style="margin-top:4px">Prediction-market prices are risk-neutral, shown as context — never the engine's statistic.</div>`;

let CURRENT_READ=null;
function setChipsFromMarket(mn,ps){ mn=mn||{}; const bp=mn.brent||{}, gpr=mn.gpr||{};
  $("dateline").innerHTML="DATA AS OF "+esc(mn.as_of||"—")+(bp.level!=null?"   ·   BRENT "+esc(bp.level)+" ("+mnum(bp.chg5d,1)+"% 5d)":"");

  $("chips").innerHTML=chips.join(""); }
async function readArticle(text, src){ text=(text||"").trim(); if(!text) return; showDesk(); $("brief").innerHTML=skeleton(); window.scrollTo({top:0,behavior:"smooth"});
  try{ const d=await postJSON("/wb_deconstruct",{text});
    let extra=src||{}; if(isURL(text)){ extra=await extractFor(text,(src&&src.source)||""); }
    renderRead(d, extra);
  }catch(e){ $("brief").innerHTML=errorBox("Couldn't read that article."); } }
function analyzeClaim(t){ $("q").value=t; analyze(); }
function renderRead(d, src){
  if(!d || d.error){ $("brief").innerHTML=errorBox((d&&(d.note||d.error))||"no read"); return; }
  CURRENT_READ=d; setChipsFromMarket(d.market_now, d.public_sentiment); src=src||{};
  const at=d.article_type||{}, srcUrl=src.url||d.url||"", srcName=src.source||"";
  let h=`<div class="rd">`;
  h+=`<div class="rd-kicker">The data read<span class="rd-type">${at.type==="opinion"?"Op-ed":"Report"}</span></div>`;
  h+=`<h1 class="rd-head">${md(d.headline_read)}</h1>`;
  h+=`<div class="rd-src">${srcName?esc(srcName)+" · ":""}${srcUrl?`<a href="${esc(srcUrl)}" target="_blank" rel="noopener">read the original ↗</a> · `:""}<span>${d.n_claims} claims examined</span></div>`;
  if(at.note) h+=`<div class="rd-lead">${esc(at.note)}</div>`;
  const claims=d.claims||[];
  if(!claims.length){
    h+=`<div class="rd-lead" style="margin-top:24px">No claim in this article maps to an event class the engine measures, so there is nothing to bind to the record. Paste an oil/markets/geopolitics story to see the data read it.</div>`;
  } else {
    h+=`<div class="rd-section">Claim by claim — what the data says</div>`;
    h+=`<div class="rd-legend"><span class="lg"><span class="d m"></span>materially larger than normal</span><span class="lg"><span class="d i"></span>typical move in line</span><span class="lg"><span class="d n"></span>no measured class</span></div>`;
    claims.forEach((c,idx)=>{ const v=c.verdict||{}, st=(v.stance||"no_class").replace(/[^a-z_]/g,"");
      h+=`<div class="rd-claim"><p class="rd-quote">${esc(c.text)}</p>`;
      h+=`<div class="rd-verdict ${st}"><span class="dot"></span><span>${md(v.text||"")}</span></div>`;
      const tags=[]; if(c.event_class) tags.push(c.event_class); if(c.modality==="hypothetical") tags.push("hypothetical");
      (c.entities||[]).slice(0,3).forEach(e=>tags.push(String(e).split(".").pop())); (c.figures||[]).forEach(f=>tags.push(f));
      if(tags.length) h+=`<div class="rd-tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`;
      const ev=c.evidence;
      if(ev){ const pr=ev.nearest_precedent;
        h+=`<details class="rd-ev"><summary>the measured evidence →</summary><div class="body"><div class="kv">
          <span class="k">base rate</span><span>median 20-day move ${f1(ev.median_move_pct)}% · typical ${f1(ev.iqr_pct[0])}–${f1(ev.iqr_pct[1])}% · n=${ev.n}${ev.gate&&ev.gate!=="full"?" (small sample)":""} · ${ord(ev.class_percentile)} pct of ordinary moves</span>`
          +(pr?`<span class="k">nearest precedent</span><span>${esc(pr.date)} — ${esc((pr.title||"").slice(0,60))} ${pr.abs_car20_pct!=null?"("+f1(pr.abs_car20_pct)+"%)":""} ${pr.source_url?`<a href="${esc(pr.source_url)}" target="_blank" rel="noopener">↗</a>`:""}</span>`:"")
          +(ev.cross_asset&&ev.cross_asset.length?`<span class="k">cross-asset</span><span>${ev.cross_asset.map(a=>`${esc(a.label)} ${mnum(a.car20,1)}${a.unit==="%"?"%":"bps"}`).join(" · ")}</span>`:"")
          +`</div><div class="rd-cta"><button data-claim-idx="${idx}">full quant read →</button></div></div></details>`;
      }
      h+=`</div>`;
    });
  }
  // The historical record — every comparable event on file, with its measured move.
  const hr=d.historical_record;
  if(hr && hr.events && hr.events.length){
    h+=`<div class="rd-section">The historical record — every ${esc(hr.event_class)} event on file (${hr.n_total})</div>`;
    h+=`<table class="grid" style="margin-top:6px"><tr><th>date</th><th>event</th><th class="n">20-day move</th><th class="n">match</th><th>src</th></tr>`
      +hr.events.map(e=>`<tr><td class="n">${esc(e.date)}</td><td>${esc(e.title)}</td><td class="n">${e.abs_car20_pct!=null?f1(e.abs_car20_pct)+"%":"n/a"}</td><td class="n ${e.shared_entities?"":"faint"}">${e.shared_entities||""}</td><td>${e.source_url?`<a href="${esc(e.source_url)}" target="_blank" rel="noopener">↗</a>`:""}</td></tr>`).join("")
      +`</table><div class="disc" style="margin-top:6px">${esc(hr.note||"")}</div>`;
  }
  // Public mood ONLY when the article has a measurable class (else global signals would overclaim).
  const ps=d.public_sentiment||{};
  if(d.dominant_class && Object.keys(ps).filter(k=>k!=="note").length){
    h+=`<div class="rd-mood"><h4>Public mood — sentiment as data</h4>`;
    const g=ps.geopolitical_risk; if(g) h+=`<div class="row"><span class="k">geopolitical risk</span><span>${ord(g.percentile)} percentile — ${esc(g.band||"")} <span class="faint">${esc(g.posture||"")}</span></span></div>`;
    if(ps.coverage_tone) h+=`<div class="row"><span class="k">coverage tone</span><span>${ps.coverage_tone.map(t=>`${esc(t.topic)} <span class="${(t.tone||0)<0?"neg":"pos"}">${esc(t.mood||"")}</span>`).join(" · ")}</span></div>`;
    if(ps.attention_spikes) h+=`<div class="row"><span class="k">attention</span><span>${ps.attention_spikes.map(a=>`${esc(a.page)} ${a.x_median}×`).join(" · ")}</span></div>`;
    if(ps.conflict_media) h+=`<div class="row"><span class="k">conflict media</span><span>${ps.conflict_media.map(a=>`${esc(a.situation)} ${esc(a.band)}`).join(" · ")}</span></div>`;
    h+=`<div class="disc" style="margin-top:10px">${esc(ps.note||"")}</div></div>`;
  }
  h+=`<div class="rd-cta">${claims.length?`<button class="primary" id="rdCentral">Full quant brief on the central event →</button>`:""}
      <button class="ghost" onclick="window.print()">Print / PDF</button></div>`;
  h+=`<div class="rd-foot">${esc(d.discipline||"")} · latency ${d.latency_ms}ms</div></div>`;
  $("brief").innerHTML=h;
  // apostrophe-safe wiring (never interpolate claim text into an inline handler)
  $("brief").querySelectorAll("[data-claim-idx]").forEach(b=>b.addEventListener("click",()=>analyzeClaim(claims[+b.dataset.claimIdx].text)));
  const cen=$("rdCentral"); if(cen&&claims[0]) cen.addEventListener("click",()=>analyzeClaim(claims[0].text));
}

    ${e.description?`<div class="dim" style="font-size:var(--t-sm);margin:6px 0">${esc(e.description)}</div>`:""}
    <div class="num" style="font-size:var(--t-sm)">CAR +1 ${f1(c["CAR+1"])}% · +5 ${f1(c["CAR+5"])}% · +10 ${f1(c["CAR+10"])}% · +20 ${f1(c["CAR+20"])}%</div>
    <div style="font-size:var(--t-cap);margin-top:6px"><a href="${esc(e.source_url)}" target="_blank" rel="noopener">${esc(e.source_url)}</a></div>`;
  box.scrollIntoView({behavior:"smooth",block:"nearest"}); }

/* ---------------- wire up ---------------- */
$("q").addEventListener("keydown",e=>{ if(e.key==="Enter") readArticle($("q").value); });
$("asq").addEventListener("input",schedNews);
$("notes").addEventListener("input",scheduleSave);
$("hq").addEventListener("input",schedHist);
$("srcList").addEventListener("click",e=>{ const it=e.target.closest(".item"); if(it) openArticle(it.dataset.hl,it.dataset.url,it.dataset.src); });
$("srcList").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const it=e.target.closest(".item"); if(it) openArticle(it.dataset.hl,it.dataset.url,it.dataset.src); } });
$("hres").addEventListener("click",e=>{ const r=e.target.closest(".r"); if(r) openEv(r.dataset.id); });
$("hres").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const r=e.target.closest(".r"); if(r) openEv(r.dataset.id); } });
document.addEventListener("keydown",e=>{ if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){ e.preventDefault(); showTab("search"); } });
loadDaily(); loadToday(); loadNote(); hist();
</script>
