<!DOCTYPE html>
<!--
  trace.html — THE SHOCK-TRACER. Pick an anchor (country / chokepoint / commodity) and see
  the ripple the engine has MEASURED: which products this entity's real events actually moved
  (avg 20-day CAR, n, range, live level), the honest "priced as risk vs realized disruption"
  flag, its physical exposure (sourced), chokepoint flow, the events themselves, and the
  validated transmission arcs. Vanilla JS + inline SVG. Composes /trace; fabricates nothing.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Engine — Shock Tracer</title>
<link rel="stylesheet" href="/desk.css">
<style>
 html,body{height:100%} body{overflow:hidden}
 .wrap{display:grid;grid-template-columns:280px 1fr;height:calc(100% - 54px)}
 .side{background:var(--bg1);border-right:1px solid var(--line);overflow-y:auto;padding:8px}
 .side input{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 9px;font:12px var(--mono);margin-bottom:8px}
 .grp{font:600 10px var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin:12px 8px 4px}
 .it{display:flex;justify-content:space-between;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;font-size:13px}
 .it:hover{background:var(--bg2)} .it.sel{background:var(--bg2);border-color:var(--accent)}
 .it .n{font:11px var(--mono);color:var(--faint)}
 main{overflow-y:auto;padding:18px 24px}
 h2{font:600 22px var(--sans);margin:0} .sub{color:var(--faint);font:12px var(--mono);margin:4px 0 14px}
 .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--faint)}
 .lbl{text-transform:uppercase;letter-spacing:.09em;font:700 11px var(--mono);color:var(--gold);border-top:1px solid var(--line);padding-top:8px;margin:20px 0 10px}
 .rrow{display:grid;grid-template-columns:200px 1fr 150px;gap:12px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
 .rrow .nm{font-size:13px} .rrow .meta{font:11px var(--mono);color:var(--faint)}
 .bar{position:relative;height:16px;background:linear-gradient(90deg,transparent,transparent);}
 .bar .mid{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)}
 .bar .fill{position:absolute;top:2px;height:12px;border-radius:2px}
 .chip{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:10px;font:10px var(--mono);color:var(--faint);margin-left:6px}
 .card{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font:12px var(--mono)}
 table{width:100%;border-collapse:collapse;font:12px var(--mono)} td,th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)} th{color:var(--dim)}
 a{color:var(--accent);text-decoration:none} .foot{color:var(--dim);font:11px var(--mono);margin:22px 0 50px;border-top:1px solid var(--line);padding-top:10px}
 .spin{color:var(--faint);padding:40px;text-align:center;font:12px var(--mono)}
 .live{color:var(--ink)}
 .statebox{background:var(--bg1);border:1px solid var(--gold);border-radius:8px;padding:12px 14px;margin:14px 0}
 .statebox .tn{display:flex;gap:22px;align-items:center;font:13px var(--mono);margin:6px 0}
 .statebox .read{font-size:13px;line-height:1.5;color:var(--ink);margin-top:6px}
 .fvp{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
 @media(max-width:900px){.fvp{grid-template-columns:1fr}}
 .fvp .read{font-size:13px;line-height:1.5} .fvp .tr{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:5px 0;font:12px var(--mono)}
</style></head><body>
<div class="mast">
  <div class="brand"><b>◆ Ripple</b> · Shock-Tracer</div>
  <nav class="seg"><a href="/terminal">Terminal</a><a class="on" href="/trace_view">Trace</a>
    <a href="/backtest_view">Back-test</a><a href="/question_view">Question</a><a href="/workbench">Workbench</a></nav>
</div>
<div class="wrap">
  <aside class="side"><input id="q" placeholder="filter anchors…"><div id="anchors"><div class="spin">loading…</div></div></aside>
  <main id="main"><div class="spin">pick an anchor on the left — a country, chokepoint, or commodity — to trace its ripple.</div></main>
</div>
<script>
const $=s=>document.querySelector(s), api=async p=>(await fetch(p)).json();
const esc=s=>(s==null?'':String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])));
let ANCHORS=null;
function sgn(v){return v>0?'up':(v<0?'down':'flat')}
async function loadAnchors(){
  ANCHORS=await api('/trace_entities'); render();
  $('#q').oninput=render;
  const pe=new URLSearchParams(location.search).get('entity');   // deep-link: /trace_view?entity=country.iran
  if(pe){ const el=$('#anchors').querySelector(`.it[data-id="${pe}"]`); if(el) el.classList.add('sel'); go(pe); }
}
function render(){
  const f=($('#q').value||'').toLowerCase(); let h='';
  for(const g of ANCHORS.groups){
    const items=g.items.filter(it=>it.name.toLowerCase().includes(f)||it.entity_id.includes(f));
    if(!items.length) continue;
    h+=`<div class="grp">${g.type}</div>`;
    for(const it of items.slice(0,40))
      h+=`<div class="it" data-id="${esc(it.entity_id)}"><span>${esc(it.name)}</span><span class="n">${it.n_events}</span></div>`;
  }
  $('#anchors').innerHTML=h;
  $('#anchors').querySelectorAll('.it').forEach(el=>el.onclick=()=>{
    $('#anchors').querySelectorAll('.it').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); go(el.dataset.id); });
}
async function go(entity){
  $('#main').innerHTML='<div class="spin">tracing…</div>';
  const d=await api('/trace?entity='+encodeURIComponent(entity));
  if(d.error){$('#main').innerHTML='<div class="spin">'+esc(d.error)+'</div>';return;}
  const a=d.anchor, live=d.anchor_live&&d.anchor_live.live;
  const sc=d.state_context;
  const scHtml=(sc&&sc.available)?`<div class="statebox">
    <div class="lbl" style="border:0;margin:0">Then vs Now — world-state conditioning <span class="chip">${esc(sc.conditioner)}</span></div>
    <div class="tn"><div><span class="faint">NOW</span><br><b>VIX ${(+sc.now.vix_pct).toFixed(0)}th</b> pct · ${esc(sc.now.regime)}<br>
        <span class="faint">inv ${sc.now.inv_sigma!=null?(+sc.now.inv_sigma).toFixed(1)+'σ':'—'} · COT ${sc.now.cot_pct!=null?(+sc.now.cot_pct).toFixed(0)+'th':'—'}</span></div>
      <div style="font-size:22px;color:var(--dim)">→</div>
      <div><span class="faint">THEN · these ${sc.then.n} events</span><br><b>VIX ~${(+sc.then.vix_pct_median).toFixed(0)}th</b> median<br>
        <span class="faint">${sc.then.pct_events_stress_on}% landed in stress-ON</span></div></div>
    <div class="read">${esc(sc.read)}</div>
    <div class="faint" style="font-size:10px;margin-top:4px">${esc(sc.context_note)}</div></div>`:'';
  const R=d.measured_reactions||[]; const mx=Math.max(1,...R.map(r=>Math.abs(r.avg20||0)));
  const TOP=R.slice(0,12);
  const bars=TOP.map(r=>{ const v=r.avg20||0, w=Math.abs(v)/mx*50, l=r.live;
    return `<div class="rrow"><div class="nm">${esc(r.name)}</div>
      <div class="bar"><div class="mid"></div>
        <div class="fill ${v>=0?'':'x'}" style="${v>=0?`left:50%;width:${w}%;background:var(--up)`:`right:50%;width:${w}%;background:var(--down)`}"></div></div>
      <div class="meta"><span class="${sgn(v)}">${v>0?'+':''}${v}%</span> · n=${r.n} · [${r.lo}..${r.hi}]<br>
        <span class="chip">${esc(r.read)}</span>${l?` <span class="live">live ${(+l.value).toFixed(2)}</span>`:''}</div></div>`;}).join('');
  const fp=d.flow_vs_price;
  const fpHtml=(fp&&fp.price_persistence)?`<div class="lbl">Flow vs Price — did trade actually stop?</div>
    <div class="fvp"><div><div class="read">${esc(fp.read)}</div>
      <div class="faint" style="font-size:10px;margin-top:6px">${esc(fp.caveat)}</div></div>
      <div><div class="faint" style="font:10px var(--mono);margin-bottom:5px">LIVE TANKER TRANSITS · 7d vs 2026 baseline</div>
      ${(fp.live_transits||[]).map(t=>`<div class="tr"><span>${esc(t.chokepoint.replace(/_/g,' '))}</span>
        <span class="${t.pct_vs_norm<0?'down':'up'}">${t.pct_vs_norm>0?'+':''}${t.pct_vs_norm}%</span>
        <span class="faint">${t.recent7d} vs ${t.baseline}</span></div>`).join('')}</div></div>`:'';
  const exp=(d.physical_exposure||[]).map(e=>`<span class="chip">${esc(e.commodity)} · ${esc(e.stage||'')} · ${e.share_pct}% <span class="faint">(${esc(e.source||'')})</span></span>`).join(' ');
  const flow=(d.chokepoint_flow||[]).map(f=>`<div class="card">${esc(f.name)} — <span class="live">${f.live?(+f.live.value).toFixed(2):'—'}</span> ${esc(f.unit||'')} <span class="faint">as of ${f.live?f.live.obs_date:'—'}</span></div>`).join('');
  const evs=(d.events_involving||[]).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.type)}</td><td>${esc(e.title)}</td><td class="faint">${esc(e.role)}</td><td>${e.source_url?`<a href="${esc(e.source_url)}" target="_blank">↗</a>`:''}</td></tr>`).join('');
  const trans=(d.transmission_validated||[]).map(t=>`<div class="card">${esc(t.from)} → <b>${esc(t.to)}</b> <span class="faint">(${esc(t.lag)}, strength ${(+t.strength).toFixed(1)}) — ${esc(t.mechanism)}</span></div>`).join('');
  $('#main').innerHTML=`
    <h2>${esc(a.name)} <span class="chip">${esc(a.type)}</span></h2>
    <div class="sub">${d.n_events_involving} corpus events involve this entity${live?` · anchor live ${(+live.value).toFixed(2)} (${esc(d.anchor_live.name)}, as of ${live.obs_date})`:''}</div>
    ${scHtml}
    <div class="lbl">The ripple — what this entity's real events actually moved (measured, 20-day CAR) <span class="faint" style="font-weight:400;text-transform:none">— top ${Math.min(12,R.length)} of ${R.length} by magnitude</span></div>
    ${R.length?bars:'<div class="faint">no measured reactions on record</div>'}
    ${fpHtml}
    ${exp?`<div class="lbl">Physical exposure — strategic commodities it is supply-critical for (sourced)</div><div>${exp}</div>`:''}
    ${flow?`<div class="lbl">Chokepoint flow — did trade actually move</div>${flow}`:''}
    <div class="lbl">Validated transmission — how a shock propagates under stress</div>${trans}
    <div class="lbl">Events involving this entity</div><table><thead><tr><th>date</th><th>type</th><th>title</th><th>role</th><th></th></tr></thead><tbody>${evs}</tbody></table>
    <div class="foot">${esc(d.note)}</div>`;
}
loadAnchors().catch(e=>$('#anchors').innerHTML='<div class="spin">backend not reachable</div>');
</script>
</body></html>
