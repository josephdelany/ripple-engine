<!DOCTYPE html>
<!-- backtest.html — THE BACK-TEST CONSOLE. How the engine scored against REALITY, out-of-sample.
     Reads /backtest (holdout / walk-forward / analogue / resolved gaps). Shows validated edges
     AND honest nulls side by side — the null is the retrain signal, never a tuned test. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Engine — Back-test vs Reality</title>
<link rel="stylesheet" href="/desk.css">
<style>
 .wrap{max-width:1000px;margin:0 auto;padding:26px 24px 80px}
 h1{font:600 26px var(--sans);margin:0 0 4px} .sub{color:var(--faint);font:12px var(--mono);margin-bottom:18px}
 .card{margin-bottom:14px}
 .card h3{margin:0;font:600 16px var(--sans);display:flex;align-items:center;gap:10px}
 .detail{margin-top:8px;font-size:14px;line-height:1.55} .spec{margin-top:6px;font:11px var(--mono);color:var(--dim)}
 .note{background:var(--bg1);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6;margin-top:18px}
 .spin{color:var(--faint);padding:60px;text-align:center;font:12px var(--mono)}
</style></head><body>
<div class="mast">
  <div class="brand"><b>◆ Ripple</b> · Back-test</div>
  <nav class="seg"><a href="/terminal">Terminal</a><a href="/trace_view">Trace</a><a href="/situation_view">The Read</a>
    <a class="on" href="/backtest_view">Back-test</a><a href="/question_view">Question</a><a href="/workbench">Workbench</a></nav>
</div>
<div class="wrap" id="wrap"><div class="spin">scoring against reality…</div></div>
<script>
const esc=s=>(s==null?'':String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])));
(async()=>{
  let d; try{ d=await (await fetch('/backtest')).json(); }catch(e){ document.getElementById('wrap').innerHTML='<div class="spin">backend not reachable</div>'; return; }
  const cards=(d.panels||[]).map(p=>`<div class="card">
    <h3>${esc(p.title)} <span class="badge ${p.good?'good':'bad'}">${esc(p.verdict)}</span></h3>
    <div class="detail">${esc(p.detail||'')}</div>
    ${p.spec?`<div class="spec">${esc(p.spec)}</div>`:''}</div>`).join('');
  const wf=d.walk_forward_v2; let wfHtml='';
  if(wf&&wf.windows){ const v=wf.verdict||{};
    const gGood=(v.G_conditioning||'').startsWith('VALIDATED');
    const wc=Object.entries(wf.windows).map(([nm,w])=>`<div class="card">
      <h3>${nm} · test ${esc(w.test_window[0])}→${esc(w.test_window[1])} <span class="badge ${(w.G_skill||0)>0?'good':'bad'}">G-skill ${w.G_skill>0?'+':''}${w.G_skill}</span></h3>
      <div class="detail">Escalation Brier <b>${w.G_brier_conditioned}</b> conditioned vs <b>${w.G_brier_baseline}</b> baseline (n=${w.n_scored}). Magnitude MAE ${w.P_mae_conditioned} vs ${w.P_mae_baseline} (P-skill ${w.P_skill}).</div></div>`).join('');
    wfHtml=`<div class="lbl" style="color:var(--accent);margin-top:6px">Walk-forward v2 — the registered self-test (point-in-time, two windows)</div>
      <div class="card" style="border-color:var(--accent)"><h3>Escalation conditioning: <span class="badge ${gGood?'good':'bad'}">${esc(v.G_conditioning||'')}</span></h3>
      <div class="detail">Magnitude conditioning: ${esc(v.P_conditioning||'')}. ${esc(v.note||'')}</div></div>${wc}`;
  }
  document.getElementById('wrap').innerHTML=`
    <h1>Back-test against reality</h1>
    <div class="sub">Walk the modern-history corpus point-in-time · predict · score vs what actually happened · keep only what survives out-of-sample${d.as_of?` · as of ${esc(d.as_of)}`:''}</div>
    ${wfHtml}
    ${cards}
    <div class="note">${esc(d.honest_note)}</div>`;
})();
</script>
</body></html>
