<!DOCTYPE html>
<!-- backtest.html — THE BACK-TEST CONSOLE. How the engine scored against REALITY, out-of-sample.
     Reads /backtest (holdout / walk-forward / analogue / resolved gaps). Shows validated edges
     AND honest nulls side by side — the null is the retrain signal, never a tuned test. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Engine — Back-test vs Reality</title>
<style>
 :root{--bg0:#0B0E14;--bg1:#141924;--bg2:#1C222E;--line:rgba(255,255,255,.08);--ink:#e7ebf3;
  --faint:#8b94a7;--dim:#5b6577;--up:#4ec9a6;--down:#e0655f;--accent:#6ea8fe;--gold:#e2b04a;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;--sans:-apple-system,Segoe UI,Roboto,sans-serif}
 *{box-sizing:border-box} body{margin:0;background:var(--bg0);color:var(--ink);font:14px/1.5 var(--sans)}
 .mast{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--bg1);border-bottom:1px solid var(--line);position:sticky;top:0}
 .mast .logo{font:600 15px var(--mono);letter-spacing:.06em} .mast .logo b{color:var(--accent)}
 .mast nav{margin-left:auto;display:flex;gap:6px}
 .mast nav a{font:11px var(--mono);color:var(--faint);text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:6px}
 .mast nav a.here{color:var(--accent);border-color:var(--accent)} .mast nav a:hover{color:var(--ink)}
 .wrap{max-width:1000px;margin:0 auto;padding:26px 24px 80px}
 h1{font:600 26px var(--sans);margin:0 0 4px} .sub{color:var(--faint);font:12px var(--mono);margin-bottom:18px}
 .card{background:var(--bg1);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
 .card h3{margin:0;font:600 16px var(--sans);display:flex;align-items:center;gap:10px}
 .badge{font:700 11px var(--mono);padding:3px 10px;border-radius:20px}
 .badge.good{background:rgba(78,201,166,.15);color:var(--up);border:1px solid var(--up)}
 .badge.bad{background:rgba(224,101,95,.13);color:var(--down);border:1px solid var(--down)}
 .detail{margin-top:8px;font-size:14px;line-height:1.55} .spec{margin-top:6px;font:11px var(--mono);color:var(--dim)}
 .note{background:var(--bg1);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6;margin-top:18px}
 .spin{color:var(--faint);padding:60px;text-align:center;font:12px var(--mono)}
</style></head><body>
<div class="mast">
  <div class="logo"><b>◆ RIPPLE</b> BACK-TEST</div>
  <nav><a href="/terminal">Terminal</a><a href="/trace_view">Trace</a>
    <a class="here" href="/backtest_view">Back-test</a><a href="/question_view">Question</a><a href="/workbench">Workbench</a></nav>
</div>
<div class="wrap" id="wrap"><div class="spin">scoring against reality…</div></div>
<script>
const esc=s=>(s==null?'':String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])));
(async()=>{
  let d; try{ d=await (await fetch('/backtest')).json(); }catch(e){ document.getElementById('wrap').innerHTML='<div class="spin">backend not reachable</div>'; return; }
  const cards=(d.panels||[]).map(p=>`<div class="card">
    <h3>${esc(p.title)} <span class="badge ${p.good?'good':'bad'}">${esc(p.verdict)}</span></h3>
    <div class="detail">${esc(p.detail||'')}</div>
    ${p.spec?`<div class="spec">${esc(p.spec)}</div>`:''}</div>`).join('');
  document.getElementById('wrap').innerHTML=`
    <h1>Back-test against reality</h1>
    <div class="sub">Walk the modern-history corpus point-in-time · predict · score vs what actually happened · keep only what survives out-of-sample${d.as_of?` · as of ${esc(d.as_of)}`:''}</div>
    ${cards}
    <div class="note">${esc(d.honest_note)}</div>`;
})();
</script>
</body></html>
