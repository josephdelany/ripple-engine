# track.yml -- the free, always-on tracker (GitHub Actions).
#
# Runs the whole deterministic engine daily in GitHub's cloud, so no machine of
# Joe's has to stay on. It rebuilds oil.db from the free sources, restores the
# durable memory from committed CSVs, runs the live cycle, snapshots the memory
# back, pushes high-signal alerts to the phone (ntfy), and commits the updated
# state. The LLM synthesis is NOT here -- that runs on the Mac Pro, on Joe's
# subscription (see ops/SYNTHESIZE.md). Cost: $0.
#
# One-time setup by Joe: ops/GITHUB_ACTIONS.md (add the EIA_API_KEY + NTFY_TOPIC
# secrets, enable Actions).

name: track

on:
  schedule:
    - cron: "0 11 * * *"    # daily at 11:00 UTC
  workflow_dispatch: {}       # and on-demand from the Actions tab

permissions:
  contents: write            # to commit the refreshed state back to the repo
  pages: write               # to publish The Daily to GitHub Pages
  id-token: write            # required by the Pages deploy action

concurrency:                 # shared with watch.yml so state-writers never overlap
  group: ripple-engine-state
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (gate -- a broken build never reaches prod)
        run: |
          pip install pytest
          python3 -m pytest -q

      - name: Rebuild schema + restore durable memory
        run: |
          python3 src/init_db.py
          python3 src/import_state.py   # situation_log + reads, BEFORE any attach

      - name: Run the daily cycle (fetch -> derive -> memory -> resolve -> render)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}   # optional: satellite-fire modality
        run: python3 src/refresh.py

      - name: Data health check + alert (non-gating -- pings phone if data broke)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 src/heartbeat.py

      - name: Snapshot memory + push high-signal alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # unset -> notify is a no-op dry run
        run: |
          python3 src/export_state.py
          python3 src/notify.py

      - name: Commit the refreshed state
        run: |
          git config user.name  "ripple-bot"
          git config user.email "ripple-bot@users.noreply.github.com"
          git add data/state data/alert_queue.csv data/watch_seen.db data/engine_read.json data/corroboration_weights.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."; exit 0
          fi
          git commit -m "chore(track): daily state $(date -u +%Y-%m-%dT%H:%MZ)"
          # Commit FIRST, then push with a rebase-retry. On the rare conflict on a
          # generated file, -X theirs keeps our fresh snapshot. (Serialized with
          # watch.yml via the shared concurrency group, so this rarely fires.)
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected; rebasing on latest..."
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          git push

      - name: Build the Pages site (The Daily as index.html)
        run: |
          mkdir -p _site
          cp data/digest.html _site/index.html
          if [ -d data/situations ]; then cp -r data/situations _site/situations; fi

      - name: Upload The Daily as a downloadable artifact (fallback before Pages is on)
        uses: actions/upload-artifact@v4
        with:
          name: the-daily
          path: _site
          if-no-files-found: warn

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Second job: publish what the track job built to GitHub Pages.
  deploy-pages:
    needs: track
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
