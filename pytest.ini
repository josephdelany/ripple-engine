[pytest]
# Default collection is the maintained public-product gate. The historical research suite remains
# preserved and can be run explicitly with `make test-historical`; it includes networked loaders and
# assertions for superseded publications, so it is not a release gate.
testpaths = tests
python_files = test_structural_surface_experiment.py test_structural_surface_demo.py test_public_claim_guard.py test_verify_submission.py
norecursedirs = parked _legacy_snapshot .git data/state/raw node_modules
