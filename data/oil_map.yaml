# The oil transit MAP -- the physical geography the engine watches.
#
# Chokepoints sized by throughput (mbd = approx million barrels/day of crude + products
# through the passage). Figures are EIA "World Oil Transit Chokepoints" estimates --
# directional, sourced, not invented. `adjacent` lists country slugs so the map can colour
# a chokepoint by whether its theatre is in an active situation (see src/backend.py).
#
# This is the base layer; live status (PortWatch flow anomaly, active situation, fires)
# is painted on at render time from data we already collect.

chokepoints:
  hormuz:          {name: "Strait of Hormuz",           lat: 26.57, lon: 56.25, mbd: 21, adjacent: [iran, saudi_arabia, uae], source: "EIA"}
  malacca:         {name: "Strait of Malacca",          lat: 1.43,  lon: 102.9, mbd: 23, adjacent: [china, taiwan],          source: "EIA"}
  suez:            {name: "Suez Canal + SUMED",         lat: 30.0,  lon: 32.55, mbd: 9,  adjacent: [egypt],                  source: "EIA"}
  bab_el_mandeb:   {name: "Bab el-Mandeb",              lat: 12.6,  lon: 43.35, mbd: 8,  adjacent: [yemen],                  source: "EIA"}
  turkish_straits: {name: "Turkish Straits (Bosphorus)",lat: 41.1,  lon: 29.05, mbd: 3,  adjacent: [russia, ukraine],        source: "EIA"}
  danish_straits:  {name: "Danish Straits",             lat: 55.7,  lon: 12.7,  mbd: 3,  adjacent: [russia],                 source: "EIA"}
  cape_good_hope:  {name: "Cape of Good Hope",          lat: -34.4, lon: 18.47, mbd: 5,  adjacent: [south_africa],           source: "EIA"}
  panama:          {name: "Panama Canal",               lat: 9.1,   lon: -79.7, mbd: 1.5,adjacent: [],                       source: "EIA"}

ports:
  ras_tanura:   {name: "Ras Tanura (SA)",     lat: 26.64, lon: 50.16, adjacent: [saudi_arabia]}
  fujairah:     {name: "Fujairah (UAE)",      lat: 25.12, lon: 56.34, adjacent: [uae]}
  rotterdam:    {name: "Rotterdam",           lat: 51.95, lon: 4.14,  adjacent: [netherlands]}
  houston:      {name: "Houston (US Gulf)",   lat: 29.75, lon: -95.06,adjacent: [usa]}
  novorossiysk: {name: "Novorossiysk (RU)",   lat: 44.72, lon: 37.79, adjacent: [russia]}
