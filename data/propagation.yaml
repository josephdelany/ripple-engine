# The oil / energy PROPAGATION GRAPH -- "everything oil touches."
#
# Each CHAIN is a directional transmission path: a shock at a `trigger` geography hits a
# `choke` (the tight, hard-to-substitute step), which gates a `downstream` market. This is
# how the engine reasons about ripple beyond the oil price itself.
#
# Two geometries (see ANALYST_TERMINAL_BLUEPRINT.md sec 3):
#   - bulk      : price pass-through (crude->products->inflation). Fast at top, slow at consumer.
#   - chokepoint: "small input, big consequence" -- price fires in weeks, replacement takes
#                 years. The tradeable asymmetry.
#
# Every share / mechanism / episode is SOURCED. Shares are approx (vintages vary) and tagged.
# `observe` names a FREE data series to watch the step (FRED/EIA/USGS/World Bank), or "none"
# where no free series exists (flagged honestly -- e.g. neon has no clean free price).
# `lag` is approximate. `countries` are situation-slugs so src/propagation.py can cross-ref
# active situations (mirrors data/criticality.yaml + situations.yaml).
#
# DISPLAY/context: this surfaces which transmission paths are LIVE. Magnitude is a later
# calibrated step, not claimed here.

chains:
  # ---- BULK COST CHAINS ---------------------------------------------------------------
  crude_to_products:
    geometry: bulk
    trigger: [saudi_arabia, russia, iran, usa]      # major crude producers / chokepoints
    countries: [saudi_arabia, russia, iran]
    choke: "refining capacity (crack-spread amplifies: products spike MORE than crude when tight)"
    downstream: "diesel->freight->goods; jet->airfares; gasoline->CPI headline"
    lag: "products days; pump 1-2 weeks (rockets-and-feathers); CPI weeks-months"
    observe: "EIA petroleum spot; FRED WPS057 (PPI refined); FRED CUSR0000SETB01 (CPI gasoline)"
    episode: "2022: Brent >$120 + 3-2-1 crack ~$60 -> US CPI ~9.1% (Jun 2022)"
    source: "EIA crack-spread explainer; Dallas Fed WP2224; BLS CPI weights"

  gas_to_fertilizer_to_food:
    geometry: bulk
    trigger: [russia, europe]                        # Russia gas; Europe = marginal producer
    countries: [russia, ukraine]
    choke: "ammonia via steam-methane reforming -- natural gas is >70% of variable cost"
    downstream: "nitrogen fertilizer (urea/UAN/AN) -> crop yields -> global food prices"
    lag: "ammonia days-weeks; fertilizer days-weeks; food ~6-12 months (state-dependent, weakest link)"
    observe: "FRED DHHNGSP (Henry Hub); World Bank Pink Sheet fertilizer; FAO Food Price Index"
    episode: "Sep 2022: ~50% of European ammonia capacity offline (CRU); Yara to ~35% utilization"
    source: "CF Industries; CRU Group; FAO; World Bank Commodity Markets"

  naphtha_ethane_to_petrochem:
    geometry: bulk
    trigger: [usa, europe, russia]
    countries: [russia]
    choke: "steam crackers (ethane=US gas-linked / naphtha=oil-linked) -> ethylene, propylene"
    downstream: "polyethylene/polypropylene -> plastics, packaging; PVC -> construction"
    lag: "resin ~1-2 months; building materials weeks-months"
    observe: "EIA Mont Belvieu ethane/propane; FRED WPU066 (plastic resins)"
    episode: "Feb 2021 Winter Storm Uri: ~75% of US ethylene offline; ethylene +78%, HDPE +61%"
    source: "Dallas Fed (Texas freeze); S&P Global; EIA"

  # ---- CHOKEPOINT CHAINS ("small input, big consequence") -----------------------------
  heavy_rare_earths:
    geometry: chokepoint
    trigger: [china]
    countries: [china]
    choke: "heavy-REE (Dy/Tb) separation -- China ~99% (near-monopoly; do NOT conflate with ~90% all-REE)"
    downstream: "NdFeB magnets -> EV motors, wind turbines, missiles/F-35, robotics"
    lag: "price days-weeks; magnet-maker 1-3mo; OEM 2-4mo; new non-China capacity YEARS"
    observe: "USGS MCS rare-earths-heavy (annual); no clean free spot price"
    episode: "2010 Senkaku embargo (Dy ~26x); 2023-25 China export-license campaign (Apr 2025 on 7 REEs)"
    source: "USGS MCS 2026; CSIS; IEA Critical Minerals Outlook 2025"

  gallium:
    geometry: chokepoint
    trigger: [china]
    countries: [china]
    choke: "gallium (GaN) -- China ~99% primary production"
    downstream: "military AESA radar, electronic warfare, 5G, power electronics"
    lag: "price days-weeks; procurement 1-3mo; defense slower (stockpiles)"
    observe: "USGS MCS gallium (annual)"
    episode: "Jul 2023 licensing -> ~doubled; Dec 2024 US ban; Nov 2025 ban SUSPENDED (licensing + mil-end-user remain)"
    source: "USGS MCS 2025; CSIS; MOFCOM notices"

  semiconductor_neon:
    geometry: chokepoint
    trigger: [ukraine, russia]
    countries: [ukraine, russia]
    choke: "semi-grade neon -- Ukraine ~50% of world chip-grade (~90% of US); Russia crude feedstock"
    downstream: "all DUV chip lithography (excimer laser buffer gas) -> ~$600bn semis"
    lag: "zero physical lag ONCE inventory runs out; real buffer = months of fab reserves"
    observe: "none (OTC specialty gas; trade-press point quotes only -- flagged)"
    episode: "2022: Ingas+Cryoin halted; wholesale neon ~4-9x; NO major fab shutdown (inventory held)"
    source: "Reuters/Techcet; CSIS; SCMP -- binding var is inventory depth x sourcing, not supply share"

  palladium:
    geometry: chokepoint
    trigger: [russia]
    countries: [russia]
    choke: "palladium -- Russia (Nornickel) ~40% of mined supply"
    downstream: "gasoline autocatalysts (~80-86% of Pd demand)"
    lag: "price near-instant; auto-production months (cushioned by ~25-30% recycling); mine years"
    observe: "stooq PA.F future; USGS MCS platinum-group (annual)"
    episode: "7 Mar 2022: palladium all-time ~$3,440/oz on airspace-closure fears (not metal sanctions)"
    source: "USGS MCS 2025; WPIC; Johnson Matthey"

  antimony:
    geometry: chokepoint
    trigger: [china, russia]
    countries: [china, russia]
    choke: "antimony -- China ~48% of mine; no US mine"
    downstream: "munitions/ammunition primers, flame retardants, PV solar glass"
    lag: "price days-weeks; procurement 1-3mo; defense slower"
    observe: "USGS MCS antimony (annual)"
    episode: "Aug 2024 controls -> ~$22k/t (Jul 2024) to ~$58k/t (Apr-May 2025), +157%; suspended Nov 2025"
    source: "USGS MCS 2025; CSIS"

  platinum:
    geometry: chokepoint
    trigger: [south_africa, russia]
    countries: [russia]
    choke: "platinum -- South Africa ~70% of mined supply"
    downstream: "diesel autocatalysts, H2 fuel cells / electrolyzers"
    lag: "price near-instant; downstream months (buffered by jewelry/industrial demand)"
    observe: "stooq PL.F future; USGS MCS platinum-group (annual)"
    episode: "2025: platinum +~90% to 12-yr high on slowing EV adoption + Russia-supply concern"
    source: "USGS MCS 2025; WPIC"

  germanium:
    geometry: chokepoint
    trigger: [china]
    countries: [china]
    choke: "germanium -- China ~60% of production"
    downstream: "night-vision/IR optics, fiber-optic cores, satellite solar"
    lag: "price days-weeks; procurement 1-3mo"
    observe: "USGS MCS germanium (annual)"
    episode: "Jul 2023 licensing +56%; Dec 2024 US ban; Nov 2025 suspended (mil-end-user ban remains)"
    source: "USGS MCS 2025; CSIS"

  tungsten:
    geometry: chokepoint
    trigger: [china]
    countries: [china]
    choke: "tungsten -- China ~80%+ of mine"
    downstream: "armor-piercing penetrators, tungsten-carbide tooling (gates ~all metal manufacturing)"
    lag: "price days-weeks; tooling supply weeks-months"
    observe: "USGS MCS tungsten (annual)"
    episode: "4 Feb 2025 China dual-use license controls (tungsten, tellurium, bismuth, molybdenum, indium)"
    source: "USGS MCS 2025; IEA; Global Trade Alert"

  helium:
    geometry: chokepoint
    trigger: [russia]                                # Qatar not yet a situation-slug; Amur=Russia
    countries: [russia]
    choke: "Grade-A helium -- Qatar ~1/3 world, Russia (Amur), US Federal Reserve sold 2024"
    downstream: "semiconductor fabs (cooling/purge) + MRI healthcare"
    lag: "inventory-gated, weeks (helium is hard to store -- shorter buffer than neon)"
    observe: "USGS MCS helium (annual; helium HAS a usable free series -- unlike neon)"
    episode: "2021-22 Amur fire; US reserve wound down 2024-25; 2026 Qatar Ras Laffan outage (developing)"
    source: "USGS MCS 2026 helium; gasworld; Science/AAAS"

  cobalt:
    geometry: chokepoint
    trigger: [congo_drc, china]
    countries: [congo_drc]
    choke: "cobalt -- DRC ~76% of mine; China ~70-75% of refined (BUT LFP substitution caps leverage)"
    downstream: "lithium-ion batteries (EV/electronics), aerospace superalloys"
    lag: "price weeks; battery supply months; mine years"
    observe: "USGS MCS cobalt (annual); IEA policy tracker"
    episode: "22 Feb 2025 DRC suspended ALL cobalt exports -> LME cobalt ~doubled by Oct 2025"
    source: "USGS MCS 2025; IEA"
